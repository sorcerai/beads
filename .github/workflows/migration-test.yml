name: Migration Test Harness

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versions:
        description: 'Specific versions to test (space-separated), or empty for all eras'
        required: false
        default: ''
      mode:
        description: 'Test mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - direct-only
          - stepping-only

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  migration-test:
    name: Migration fidelity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3

      - name: Install Dolt
        run: |
          ./scripts/install-dolt-ci.sh
          dolt version

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"

      - name: Cache old binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/beads-regression
          key: migration-test-${{ runner.os }}-${{ runner.arch }}

      - name: Build candidate
        run: go build -tags gms_pure_go -o bd ./cmd/bd

      - name: Run migration test harness
        env:
          CANDIDATE_BIN: ./bd
          GIT_CONFIG_NOSYSTEM: "1"
          MIGRATION_MODE: ${{ github.event.inputs.mode }}
          MIGRATION_VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          set -euo pipefail
          mode_args=()
          case "${MIGRATION_MODE:-}" in
            ""|all)
              ;;
            direct-only)
              mode_args=(--direct-only)
              ;;
            stepping-only)
              mode_args=(--stepping-only)
              ;;
            *)
              echo "Invalid migration test mode." >&2
              exit 1
              ;;
          esac

          version_args=()
          if [[ -n "${MIGRATION_VERSIONS:-}" ]]; then
            if [[ ! "$MIGRATION_VERSIONS" =~ ^v[0-9]+\.[0-9]+\.[0-9]+( +v[0-9]+\.[0-9]+\.[0-9]+)*$ ]]; then
              echo "Migration versions must be space-separated vMAJOR.MINOR.PATCH values." >&2
              exit 1
            fi
            read -r -a version_args <<< "$MIGRATION_VERSIONS"
          fi

          if ((${#version_args[@]} > 0)); then
            ./scripts/migration-test/run.sh "${version_args[@]}"
          else
            ./scripts/migration-test/run.sh "${mode_args[@]}"
          fi
